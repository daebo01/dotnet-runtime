on:
  push:
    branches:
    - ghtest

permissions:
  packages: write

name: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push runtime
      uses: docker/build-push-action@v5
      with:
        context: .
        file: runtime.Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/dotnet-runtime:9.0.6-alpine3.21-amd64

    - name: Build and push aspnet
      uses: docker/build-push-action@v5
      with:
        context: .
        file: aspnet.Dockerfile
        platforms: linux/amd64
        push: true
        build-args: |
          REPO=ghcr.io/${{ github.repository_owner }}/dotnet-runtime
        tags: |
          ghcr.io/${{ github.repository_owner }}/dotnet-aspnet:9.0.6-alpine3.21-amd64


